<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>戴盟 MES · 手机入口</title>
<style>
:root{--red:#E61736;--muted:#8C9199}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(60% 50% at 50% 30%,#1A1C21 0%,#0B0C0E 55%,#050506 100%);
  color:#fff;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:40px 20px}
.wrap{width:100%;max-width:860px;display:grid;grid-template-columns:1fr 330px;gap:48px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.18em;color:#9AA0A6;margin-bottom:18px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red)}
h1{font-size:34px;font-weight:800;letter-spacing:.04em;line-height:1.25;margin-bottom:14px}
h1 span{color:var(--red)}
p.lead{color:#B9BEC6;font-size:15px;line-height:1.9;margin-bottom:26px}
ol{list-style:none;counter-reset:s}
ol li{counter-increment:s;position:relative;padding-left:34px;margin-bottom:14px;font-size:14.5px;color:#D6DAE0;line-height:1.7}
ol li::before{content:counter(s);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;
  border:1px solid rgba(230,23,54,.6);color:var(--red);font-size:12px;font-weight:700;display:grid;place-items:center}
.url{margin-top:26px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.url code{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:6px;
  padding:9px 14px;font-family:Consolas,Menlo,monospace;font-size:14px;color:#fff}
.hint{margin-top:14px;font-size:12.5px;color:#7C838C;line-height:1.8}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 30px 70px rgba(0,0,0,.55)}
.card svg{display:block;width:100%;height:auto}
.cap{text-align:center;color:#484B4E;font-size:13px;margin-top:12px;font-weight:600}
.cap small{display:block;color:#8C9199;font-weight:400;margin-top:4px;font-size:11.5px;letter-spacing:.06em}
@media(max-width:820px){.wrap{grid-template-columns:1fr;gap:30px;text-align:center}
  ol{text-align:left;max-width:420px;margin:0 auto}h1{font-size:26px}.url{justify-content:center}}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="tag"><span class="dot"></span>DAIMON MES · 手机入口</div>
    <h1>手机扫码<br>直接进<span>生产系统</span></h1>
    <p class="lead">手机和这台电脑连同一个 Wi-Fi，扫码即可打开登录页。加到主屏幕后，下次点图标就能进。</p>
    <ol>
      <li>手机相机或微信扫右侧二维码</li>
      <li>用 admin 登录（密码见电脑端登录页提示）</li>
      <li>浏览器菜单 →「添加到主屏幕」，以后点图标直接进</li>
    </ol>
    <div class="url"><code>http://10.30.121.220:8007/</code></div>
    <p class="hint">备选地址：http://192.168.2.100:8007/（有线网段）<br>换 Wi-Fi 或电脑重启后 IP 可能变，重新生成此页即可。</p>

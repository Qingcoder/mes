<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MES 基础功能框架</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">M</span><div><b>MES 基础功能框架</b><small>Production Execution Framework</small></div></div>
    <nav id="nav" class="nav">
      <button data-page="dashboard" class="active">生产看板</button>
      <button data-page="orders">生产订单</button>
      <button data-page="operations">工序跟踪</button>
      <button data-page="equipment">设备监控</button>
      <button data-page="records">数据采集</button>
    </nav>
    <div class="top-actions"><span id="clock"></span><button onclick="location.reload()">刷新</button></div>
  </header>
  <main id="app" class="content"><div class="loading">加载中…</div></main>
  <div id="toasts" class="toasts"></div>
  <div id="modal-mask" class="modal-mask" onclick="if(event.target===this)window.closeModal()">
    <div id="modal" class="modal"></div>
  </div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
